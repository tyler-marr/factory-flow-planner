[mod-name]
factory-flow-planner=Factory Flow Planner

[mod-description]
factory-flow-planner=A flowchart production planner inside the game. Reads every recipe and machine from the game, so modded ones work. Plans are shared with your team.

[controls]
ffp-toggle=Factory Flow Planner: open plans / back to game
ffp-click=Factory Flow Planner: board click
ffp-right-click=Factory Flow Planner: board right-click
ffp-wheel-up=Factory Flow Planner: wheel up on a card
ffp-wheel-down=Factory Flow Planner: wheel down on a card
ffp-wheel-up-ctrl=Factory Flow Planner: wheel up, big step
ffp-wheel-down-ctrl=Factory Flow Planner: wheel down, big step
ffp-wheel-up-shift=Factory Flow Planner: wheel up, bigger step
ffp-wheel-down-shift=Factory Flow Planner: wheel down, bigger step

[shortcut-name]
ffp-shortcut=Factory Flow Planner

[item-name]
ffp-board-tool=Factory Flow Planner board tool

[ffp-hot]
header=Card
machine=Machine
count=Machine count
modules=Modules
beacons=Beacons
in=Input
out=Output
panel_header=Panel
supply=Supply item
demand=Output item

[ffp-hot-description]
header=Drag to move. Click to select and open its settings.
machine=Scroll or click: next machine. Right-click: previous.
count=Scroll: Any > Up to what runs > one more or fewer. Ctrl: ±10. Shift: ×2 or ÷2.\nClick: Any > Up to > Exactly. Right-click: back to Any.
modules=Scroll or click: next module (fills every slot). Right-click: previous.
beacons=Scroll or click: one beacon more. Right-click: one fewer. Ctrl: ±4.\nShift+scroll: change the beacon module.
in=Click: pick what makes it. Drag to an output, or onto empty space to add a maker.\nRight-click: unwire.
out=Scroll: set a target rate. ±1 in the shown unit, Ctrl ±10, Shift ±100.\nClick or drag to an input to wire it. Drag onto empty space to add a user. Right-click: unwire.
panel_header=Drag to move. Click to select and open its settings.
supply=Scroll: cap what comes in (Up to). ±1 in the shown unit, Ctrl ±10, Shift ±100. Down to zero: any amount.\nDrag to an input to wire it. Right-click: unwire.
demand=Scroll: ask for exactly this rate. ±1 in the shown unit, Ctrl ±10, Shift ±100. Down to zero: whatever arrives.\nRight-click: unwire.

[entity-name]
ffp-planner-splitter=Planner splitter (__1__)

[entity-description]
ffp-planner-splitter-description=Part of a Factory Flow Planner plan. Unlike a real splitter it doesn't split 50/50: each belt shows its planned rate.
